<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./maisn.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center"> <!--Faz com que formulario fique centralizado-->
            <div class="col-md-6"> <!--Formulario ocupa 6 colunas de 12-->
                <div class="card p4 shadow-sm"> <!--Estilo de caixa e shadow sm =adiciona sombras -->
                    <h1>Cadastro</h1>
                    <form>
                        <div class="form-group">
                            <label class="form-label" for="nome">Nome:</label>
                            <input class="form-control"  type="text" id="nome" />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email:</label>
                            <input class="form-control" type="email" id="email" />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="telefone">Telefone</label>
                            <input class="form-control" type="tel" id="telefone" />
                        </div>
                        <button class="btn btn-primary btn-block">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
